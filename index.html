<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double Slit Selects</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:32px 24px;background:#fff;color:#111;font:14px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif}
  header{max-width:1200px;margin:0 auto 28px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #ddd;padding-bottom:10px}
  h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.02em}
  header span{color:#666;font-size:13px}
  main{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:36px 28px}
  figure{margin:0;break-inside:avoid}
  .frame{text-decoration:none;width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#f4f4f4;border:0;padding:0;cursor:zoom-in}
  .frame img{max-width:88%;max-height:88%;width:auto;height:auto;display:block;transition:opacity .15s}
  .frame:hover img{opacity:.85}
  figcaption{margin-top:8px;font-size:12.5px}
  #lb{position:fixed;inset:0;background:#0c0c0c;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 64px;z-index:10;cursor:zoom-out}
  #lb.open{display:flex}
  #lb img{max-width:100%;max-height:calc(100vh - 100px);object-fit:contain;display:block}
  #lb p{color:#ddd;font-size:13px;margin:14px 0 0}
  #lb button{position:absolute;background:none;border:0;color:#bbb;font-size:34px;cursor:pointer;padding:12px;line-height:1}
  #lb button:hover{color:#fff}
  #lb .x{top:8px;right:12px;font-size:28px}
  #lb .prev{left:8px;top:50%;transform:translateY(-50%)}
  #lb .next{right:8px;top:50%;transform:translateY(-50%)}
  @media (max-width:600px){#lb{padding:24px 16px} #lb .prev,#lb .next{top:auto;bottom:8px;transform:none}}
  @media print{body{padding:0} main{grid-template-columns:repeat(3,1fr);gap:24px 18px} .frame{text-decoration:none;background:none} #lb{display:none!important}}
</style></head><body>

<main>
  <figure>
    <a class="frame" href="large/in-voluntary-ii.jpg" data-i="0"><img src="thumbs/in-voluntary-ii.jpg" width="640" height="524" loading="lazy" decoding="async" alt="(in)voluntary ii"></a>

<div id="lb" role="dialog" aria-modal="true">
  <button class="x" aria-label="Close">&times;</button>
  <button class="prev" aria-label="Previous">&#8249;</button>
  <img alt="">
  <p></p>
  <button class="next" aria-label="Next">&#8250;</button>
</div>
<script>
const L=[{"src": "large/in-voluntary-ii.jpg", "cap": "<em>(in)voluntary ii</em>, gelatin silver print, 6 x 4\", 2025/2026", "alt": "(in)voluntary ii"}, {"src": "large/in-voluntary-iii.jpg", "cap": "<em>(in)voluntary iii</em>, gelatin silver print, 4 x 4\", 2025/2026", "alt": "(in)voluntary iii"}, {"src": "large/areola.jpg", "cap": "<em>areola</em>, gelatin silver print, 7 x 5\", 2024", "alt": "areola"}, {"src": "large/double-double.jpg", "cap": "<em>double double</em>, gelatin silver print, 7 x 5\", 2026", "alt": "double double"}, {"src": "large/eyehair.jpg", "cap": "<em>eyehair</em>, gelatin silver print, 10 x 8\", 2026", "alt": "eyehair"}, {"src": "large/gesture-iix.jpg", "cap": "<em>gesture iix</em>, gelatin silver print, 5 x 7\", 2024", "alt": "gesture iix"}, {"src": "large/gesture-xi.jpg", "cap": "<em>gesture xi</em>, gelatin silver print, 5 x 7\", 2024", "alt": "gesture xi"}, {"src": "large/hairbridge.jpg", "cap": "<em>hairbridge</em>, gelatin silver print, 8 x 10\", 2026", "alt": "hairbridge"}, {"src": "large/mudstar.jpg", "cap": "<em>mudstar</em>, gelatin silver print, 7 x 5\", 2024", "alt": "mudstar"}, {"src": "large/nova.jpg", "cap": "<em>nova</em>, gelatin silver print, 7 x 5\", 2024", "alt": "nova"}, {"src": "large/song.jpg", "cap": "<em>song</em>, gelatin silver print, 7 x 5\", 2026", "alt": "song"}, {"src": "large/stain.jpg", "cap": "<em>stain</em>, gelatin silver print, 7 x 5\", 2026", "alt": "stain"}, {"src": "large/tilt.jpg", "cap": "<em>tilt</em>, gelatin silver print, 5 x 7\", 2026", "alt": "tilt"}, {"src": "large/twin-twin.jpg", "cap": "<em>twin twin</em>, gelatin silver print, 7 x 5\", 2026", "alt": "twin twin"}];
const lb=document.getElementById('lb'),im=lb.querySelector('img'),cp=lb.querySelector('p');
let cur=0;
function pre(i){const j=(i+L.length)%L.length;new Image().src=L[j].src;}
function show(i){cur=(i+L.length)%L.length;im.src=L[cur].src;im.alt=L[cur].alt;cp.innerHTML=L[cur].cap;lb.classList.add('open');pre(cur+1);pre(cur-1);}
function close(){lb.classList.remove('open');}
document.querySelectorAll('.frame').forEach(a=>a.onclick=e=>{e.preventDefault();show(+a.dataset.i);});
lb.onclick=e=>{if(e.target===lb||e.target===im)close();};
lb.querySelector('.x').onclick=close;
lb.querySelector('.prev').onclick=e=>{e.stopPropagation();show(cur-1);};
lb.querySelector('.next').onclick=e=>{e.stopPropagation();show(cur+1);};
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1);});
</script>
</body></html>
